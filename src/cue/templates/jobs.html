{% extends "base.html" %}{% block content %}<h1>Jobs</h1><table><tr><th>ID</th><th>Kind</th><th>Status</th><th>Attempts</th><th>Last error</th><th></th></tr>{% for job in jobs %}<tr><td>{{ job.id }}</td><td>{{ job.kind }}</td><td>{{ job.status }}</td><td>{{ job.attempt_count }}/{{ job.max_attempts }}</td><td>{{ job.last_error or '—' }}</td><td>{% if job.status == 'failed' %}<form class="inline" method="post" action="/jobs/{{ job.id }}/retry"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Retry</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
