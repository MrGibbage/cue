{% extends "base.html" %}{% block content %}<h1>Library</h1><form method="post" action="/library/previews"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><p>Scan the configured media directory read-only, then approve only the recognized files.</p><button>Scan existing library</button></form><h2>Recent scans</h2>{% for item in imports %}<p><a href="/library/imports/{{ item.id }}">Import #{{ item.id }}</a> <span class="tag">{{ item.status }}</span></p>{% else %}<p class="muted">No scans yet.</p>{% endfor %}{% endblock %}
