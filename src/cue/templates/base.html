<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} · Cue</title><style>
:root{color-scheme:dark;--bg:#10131a;--panel:#1a202c;--line:#303b4f;--ink:#edf2f7;--muted:#a6b3c8;--accent:#72d6ad;--warn:#f5c66b;--bad:#ff8492}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}header{display:flex;gap:1.5rem;align-items:center;padding:1rem max(4vw,1.5rem);border-bottom:1px solid var(--line)}header a{color:var(--muted);text-decoration:none}.brand{font-weight:800;color:var(--ink);font-size:1.2rem;margin-right:auto}.brand i{color:var(--accent)}main{max-width:1200px;margin:2rem auto;padding:0 1.5rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}.card,form,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem}.stat{font-size:2rem;font-weight:700;color:var(--accent)}h1{margin-top:0}h2{font-size:1.1rem}input,textarea,button{font:inherit}input,textarea{width:100%;padding:.65rem;background:#0e121b;border:1px solid var(--line);color:var(--ink);border-radius:6px}textarea{min-height:180px}button{background:var(--accent);border:0;border-radius:6px;padding:.6rem .9rem;color:#102018;font-weight:700;cursor:pointer}.secondary{background:#34415a;color:var(--ink)}.danger{background:var(--bad)}table{width:100%;border-collapse:collapse;margin-top:1rem}th,td{text-align:left;padding:.55rem;border-bottom:1px solid var(--line);vertical-align:top}.muted{color:var(--muted)}.flash{padding:.8rem;border-radius:6px;margin-bottom:1rem;background:#24334a}.flash.error{background:#4a2630}.tag{font-size:.8rem;padding:.2rem .4rem;border-radius:4px;background:#34415a}.review{color:var(--warn)}a{color:var(--accent)}.inline{display:inline}.inline button{padding:.35rem .55rem;font-size:.85rem}</style></head><body>
{% if user %}<header><a class="brand" href="/"><i>▶</i> Cue</a><a href="/library">Library</a><a href="/settings">Settings</a><form class="inline" method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary">Sign out</button></form></header>{% endif %}<main>{% if flash %}<div class="flash {{ flash[0] }}">{{ flash[1] }}</div>{% endif %}{% block content %}{% endblock %}</main></body></html>
