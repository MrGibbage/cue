[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cue"
version = "0.1.0"
description = "Personal music-video library builder"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "pwdlib[argon2]>=0.3,<1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "yt-dlp>=2025.1.15",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
cue-api = "cue.api:main"
cue-worker = "cue.worker:main"
cue-admin = "cue.admin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cue"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/cue/auth.py" = ["B008"]
"src/cue/api.py" = ["B008"]
