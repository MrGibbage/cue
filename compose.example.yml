# Deployment contract for Cue. Copy/adapt this to compose.yml when the Python
# package and container entry points are added; it intentionally documents the
# final mount and privilege boundaries before application code exists.
services:
  cue-api:
    build: .
    command: cue-api
    env_file:
      - ${CUE_ENV_FILE:-/etc/homelab/cue.env}
    user: "${CUE_PUID:-1000}:${CUE_PGID:-1000}"
    volumes:
      - ./data:/data
      - ${CUE_MEDIA_DIR:?Set CUE_MEDIA_DIR}:/media:ro
      - ${CUE_COOKIES_FILE:-/dev/null}:/run/secrets/youtube-cookies:ro
    ports:
      - "${CUE_PORT:-8080}:8080"
    restart: unless-stopped

  cue-worker:
    build: .
    command: cue-worker
    env_file:
      - ${CUE_ENV_FILE:-/etc/homelab/cue.env}
    user: "${CUE_PUID:-1000}:${CUE_PGID:-1000}"
    volumes:
      - ./data:/data
      - ${CUE_MEDIA_DIR:?Set CUE_MEDIA_DIR}:/media:rw
      - ${CUE_COOKIES_FILE:-/dev/null}:/run/secrets/youtube-cookies:ro
    restart: unless-stopped
